services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://server:3001
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:5173"
