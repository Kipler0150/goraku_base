services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goraku}
      POSTGRES_USER: ${POSTGRES_USER:-goraku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goraku_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-goraku}:${POSTGRES_PASSWORD:-goraku_dev}@postgres:5432/${POSTGRES_DB:-goraku}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://server:3001
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres-data:
